# 라이브러리 버전을 한곳에 모아 둔 파일.
# [versions]에 버전 번호를 적고, [libraries]에서 그 번호를 가져다 쓴다.
# build.gradle.kts에서는 libs.이름 으로 부른다. (이름의 - 는 . 으로 바뀐다. 예: androidx-room-runtime → libs.androidx.room.runtime)

[versions]
agp = "9.3.2"
coreKtx = "1.10.1"
appcompat = "1.6.1"
material = "1.10.0"
activityKtx = "1.8.0"
room = "2.8.4"
ksp = "2.3.12"
mlkitTextLatin = "16.0.1"
mlkitTextKorean = "16.0.1"
exifinterface = "1.4.2"
androidxLifecycle = "2.6.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }

# Room (DB)
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# 영어 OCR (구글 ML Kit)
mlkit-text-latin = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitTextLatin" }

# 한국어 OCR (구글 ML Kit). 해설 읽기용
mlkit-text-korean = { group = "com.google.mlkit", name = "text-recognition-korean", version.ref = "mlkitTextKorean" }

# 사진 회전 정보(EXIF) 읽기
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }

# lifecycleScope(화면 수명에 맞는 코루틴)
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }